plugins {
    id 'com.android.application'
}

android {
    namespace "com.xuanfeng.browser"
    compileSdk 34

    defaultConfig {
        applicationId "com.xuanfeng.browser"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.1"
    }

    // Load keystore config: CI (env vars) → local.properties
    def keystoreFile = rootProject.file('android-keystore/com.zhouyi.studio.keystore')
    def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
    def keystoreAlias = System.getenv('KEYSTORE_ALIAS')
    def keystoreKeyPassword = System.getenv('KEYSTORE_KEY_PASSWORD')

    if (!keystorePassword) {
        def localProps = rootProject.file('local.properties')
        if (localProps.exists()) {
            def props = new Properties()
            props.load(localProps.newDataInputStream())
            keystorePassword = props.getProperty('keystore.password')
            keystoreAlias = props.getProperty('keystore.alias')
            keystoreKeyPassword = props.getProperty('keystore.keyPassword')
        }
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword keystorePassword
            keyAlias keystoreAlias
            keyPassword keystoreKeyPassword
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def date = new Date().format("yyyyMMdd-HHmm")
            output.outputFileName = "XFBrowser-${date}-dev.apk"
        }
    }
}

dependencies {
 // CodeAssist does NOT support adding dependencies here,
 // try using the library manager instead
}
